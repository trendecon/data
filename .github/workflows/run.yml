name: run

# Daily Google Trends run. Replaces the old tic-based pipeline.
#  - one parallel job per country (partial failures isolated)
#  - binary package installs from Posit Package Manager (no source compilation)
#  - a single commit of all results, authenticated with the built-in GITHUB_TOKEN
#  - a GitHub issue is opened/updated on failure

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      geo:
        description: "Limit the manual run to a single country (ch/de/at), or leave blank for all."
        required: false
        default: ""
      backfill_from:
        description: "One-off: refill each keyword's daily series from this date (YYYY-MM-DD) before the regular update. Leave blank for a normal run."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: trendecon-daily-run
  cancel-in-progress: false

jobs:
  query:
    name: query (${{ matrix.geo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        geo: [ch, de, at]
    steps:
      - uses: actions/checkout@v4

      - name: Skip country on manual single-geo runs
        id: gate
        run: |
          want="${{ github.event.inputs.geo }}"
          if [ -n "$want" ] && [ "$want" != "${{ matrix.geo }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: r-lib/actions/setup-r@v2
        if: steps.gate.outputs.run == 'true'
        with:
          r-version: "4.4"
          use-public-rspm: true

      # Install via remotes rather than pak: pak 0.9.5's lockfile_create errors
      # on the GitHub tag ref ("$ operator is invalid for atomic vectors").
      # use-public-rspm above points CRAN at Posit Package Manager, so CRAN deps
      # (gtrendsR -> 1.5.2, prophet, ...) install as binaries; trendecon is
      # pure-R and builds from source quickly.
      - name: Install R dependencies
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "prophet", "tibble"))
          remotes::install_github("trendecon/trendecon@v0.3.0", upgrade = "never")

      - name: Update indices for ${{ matrix.geo }}
        if: steps.gate.outputs.run == 'true'
        env:
          TRENDECON_BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        run: Rscript run.R ${{ matrix.geo }}

      - name: Upload ${{ matrix.geo }} results
        if: ${{ always() && steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.geo }}
          path: |
            data/${{ matrix.geo }}
            raw/${{ matrix.geo }}
          retention-days: 7

  commit:
    name: commit results
    needs: query
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          merge-multiple: true
          path: .

      - name: Commit & push updated series
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data raw
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update trendecon series $(date -u +%Y-%m-%d) [skip ci]"
            git push
          fi

  notify:
    name: notify on failure
    needs: [query, commit]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Open or update a failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The scheduled trendecon data run failed on $(date -u +%Y-%m-%d). Logs: ${run_url}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search 'Daily run failed in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Daily run failed" --body "$body"
          fi
